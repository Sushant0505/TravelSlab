# Local dev backing services for TripSlab.
#
#   docker compose up -d          # start Postgres + Redis
#   npm run db:push               # create tables from prisma/schema.prisma
#   npm run db:seed               # load demo agencies / travelers / leads
#
# Matches the default DATABASE_URL / REDIS_URL in .env.example.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tripslab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripslab
    ports:
      - "5432:5432"
    volumes:
      - tripslab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tripslab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tripslab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tripslab_redis:/data

volumes:
  tripslab_pg:
  tripslab_redis:
